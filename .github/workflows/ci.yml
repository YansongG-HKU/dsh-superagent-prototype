name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from package.json's packageManager field; do not pin it twice.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The cluster tool creates profiles and starts instances only when its commands run; this
      # checks its config/template/argument surface without touching a DSH home.
      - name: Cluster tool self-check
        shell: bash
        run: |
          node tools/cluster.mjs help
          config="${{ runner.temp }}/cluster-self-check.json"
          node tools/cluster.mjs init --bundle . --dsh-bin ./lib/index.js --node node --pnpm pnpm \
            --agent-login agent --operator-login operator --agent-cli gh --config "$config"
          node tools/cluster.mjs add --repo acme/widgets --config "$config"
          node tools/cluster.mjs list --config "$config"
